<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InSign — Technology should adapt to how you communicate</title>
<meta name="description" content="InSign is an accessibility platform: a Speech Companion that adapts to how you speak, and a tremor-tolerant Sign Translator that adapts to how you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23E8A33D'/%3E%3Cpath d='M4 16h6l3-8 6 16 3-8h6' stroke='%230A0A0B' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  /* set theme before paint to avoid flash */
  try {
    const saved = localStorage.getItem('insign-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>

<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>

</html>
